[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimsight"
version = "0.1.0"
description = "Agentic claims adjudication for health insurance"
authors = [{name = "Jeet S Swadia"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    # Core
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Data
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    # Database
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    # ML
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    # Embeddings + retrieval
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    # Agents
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-groq>=0.2",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Observability
    "langfuse>=2.50",
    # Utilities
    "tenacity>=9.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]
eval = [
    "ragas>=0.2",
    "datasets>=3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Mock LLM responses contain verbatim guideline quotes that must substring-match
# the demo's chunk text. Breaking them with string concatenation would defeat
# the citation-provenance matching the demo demonstrates.
"src/agents/llm_router.py" = ["E501"]
# Demo fixtures use verbatim CPT/ICD code descriptions that occasionally exceed 100 chars.
"scripts/demo.py" = ["E501"]
# Test cases include long fixture strings to exercise the parser.
"tests/test_medical_necessity.py" = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
