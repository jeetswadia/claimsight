<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <linearGradient id="intake" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="specialist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ml" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="adjudicator" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="critic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">ClaimSight Architecture</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Multi-agent claims adjudication with citation-faithful RAG and ML fraud signals</text>

  <!-- Claim arrives -->
  <rect x="370" y="90" width="160" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Claim arrives</text>

  <!-- Intake -->
  <rect x="350" y="170" width="200" height="60" rx="8" fill="url(#intake)" filter="url(#shadow)"/>
  <text x="450" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="white">Intake Agent</text>
  <text x="450" y="215" text-anchor="middle" font-size="11" fill="#dbeafe">parse · normalize · fetch history</text>

  <!-- Specialist row -->
  <rect x="50" y="290" width="200" height="80" rx="8" fill="url(#specialist)" filter="url(#shadow)"/>
  <text x="150" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="white">Medical Necessity</text>
  <text x="150" y="335" text-anchor="middle" font-size="11" fill="#ede9fe">RAG over guidelines</text>
  <text x="150" y="352" text-anchor="middle" font-size="11" fill="#ede9fe">citation-faithful</text>

  <rect x="270" y="290" width="200" height="80" rx="8" fill="url(#specialist)" filter="url(#shadow)"/>
  <text x="370" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="white">Policy Compliance</text>
  <text x="370" y="335" text-anchor="middle" font-size="11" fill="#ede9fe">RAG over policies</text>
  <text x="370" y="352" text-anchor="middle" font-size="11" fill="#ede9fe">coverage rules</text>

  <rect x="490" y="290" width="200" height="80" rx="8" fill="url(#ml)" filter="url(#shadow)"/>
  <text x="590" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="white">Fraud Signal</text>
  <text x="590" y="335" text-anchor="middle" font-size="11" fill="#fce7f3">XGBoost + SHAP</text>
  <text x="590" y="352" text-anchor="middle" font-size="11" fill="#fce7f3">+ LLM reasoning</text>

  <rect x="710" y="290" width="160" height="80" rx="8" fill="url(#specialist)" filter="url(#shadow)"/>
  <text x="790" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="white">Prior Auth</text>
  <text x="790" y="335" text-anchor="middle" font-size="11" fill="#ede9fe">verify PA status</text>

  <!-- Adjudicator -->
  <rect x="350" y="430" width="200" height="60" rx="8" fill="url(#adjudicator)" filter="url(#shadow)"/>
  <text x="450" y="455" text-anchor="middle" font-size="15" font-weight="700" fill="white">Adjudicator</text>
  <text x="450" y="475" text-anchor="middle" font-size="11" fill="#fef3c7">synthesize signals · Claude Sonnet 4</text>

  <!-- Critic -->
  <rect x="350" y="530" width="200" height="60" rx="8" fill="url(#critic)" filter="url(#shadow)"/>
  <text x="450" y="555" text-anchor="middle" font-size="15" font-weight="700" fill="white">Critic</text>
  <text x="450" y="575" text-anchor="middle" font-size="11" fill="#d1fae5">second-pass review · can reroute</text>

  <!-- Final decision -->
  <rect x="280" y="630" width="340" height="60" rx="8" fill="#1f2937" filter="url(#shadow)"/>
  <text x="450" y="657" text-anchor="middle" font-size="14" font-weight="700" fill="white">Decision · Citations · Confidence · Cost trace</text>
  <text x="450" y="676" text-anchor="middle" font-size="11" fill="#9ca3af">approve / deny / route to human</text>

  <!-- Arrows -->
  <line x1="450" y1="138" x2="450" y2="166" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="400" y1="234" x2="180" y2="286" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="234" x2="370" y2="286" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="234" x2="570" y2="286" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="234" x2="770" y2="286" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="180" y1="374" x2="400" y2="426" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="374" x2="430" y2="426" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="374" x2="470" y2="426" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="374" x2="500" y2="426" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="450" y1="494" x2="450" y2="526" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="594" x2="450" y2="626" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Critic feedback loop -->
  <path d="M 350 555 Q 220 555 220 460 Q 220 330 270 330" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="155" y="455" font-size="11" fill="#059669" font-style="italic">re-route on disagreement</text>

  <!-- Legend -->
  <g transform="translate(50, 90)">
    <rect width="14" height="14" fill="url(#intake)" rx="2"/>
    <text x="22" y="11" font-size="11" fill="#374151">Intake</text>
    <rect y="22" width="14" height="14" fill="url(#specialist)" rx="2"/>
    <text x="22" y="33" font-size="11" fill="#374151">RAG specialists</text>
    <rect y="44" width="14" height="14" fill="url(#ml)" rx="2"/>
    <text x="22" y="55" font-size="11" fill="#374151">ML model</text>
    <rect y="66" width="14" height="14" fill="url(#adjudicator)" rx="2"/>
    <text x="22" y="77" font-size="11" fill="#374151">Synthesizer</text>
    <rect y="88" width="14" height="14" fill="url(#critic)" rx="2"/>
    <text x="22" y="99" font-size="11" fill="#374151">Critic</text>
  </g>
</svg>
